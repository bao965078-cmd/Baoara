name: Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải code
        uses: actions/checkout@v4

      - name: 🐍 Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔎 Kiểm tra file
        run: |
          python -m py_compile ku.py
          echo "✅ ku.py không có lỗi cú pháp"

      - name: 🚀 Chạy bot
        run: |
          python -u ku.py
