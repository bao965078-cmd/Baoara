name: Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải code
        uses: actions/checkout@v4

      - name: 🐍 Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔎 Kiểm tra file
        run: |
          echo "===== FILE ====="
          ls -la
          echo "===== PYTHON ====="
          python --version

      - name: 🔐 Kiểm tra BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ BOT_TOKEN CHƯA ĐƯỢC THÊM VÀO SECRETS!"
            exit 1
          fi
          echo "✅ BOT_TOKEN đã được nhận"

      - name: 🚀 Chạy bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python -u ku.py
